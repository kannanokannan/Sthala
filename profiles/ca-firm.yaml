profile: ca-firm
version: "0.1"
description: "Chartered Accountant firm — Tally data mining, GST trend analysis, client document intelligence"

# ── Hardware Requirements ─────────────────────────────────────────────────────
hardware:
  min_ram_gb: 32
  recommended_ram_gb: 64
  gpu_required: false
  gpu_vram_gb: 0         # works CPU-only; GPU gives 5-10x speedup on large sets
  min_disk_gb: 200
  tier_recommended: 2

# ── Models ────────────────────────────────────────────────────────────────────
models:
  primary:
    recommended: "bartowski/Sarvam-30B-A3B-Instruct-GGUF"
    quant: "Q6_K"
    hf_link: "https://huggingface.co/bartowski/Sarvam-30B-A3B-Instruct-GGUF"
    user_override: null      # paste any HuggingFace model ID here to override
  verifier:
    recommended: "Qwen/Qwen2.5-7B-Instruct-GGUF"
    quant: "Q4_K_M"
    hf_link: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF"
    user_override: null
  embedder:
    recommended: "nomic-ai/nomic-embed-text-v1.5"
    user_override: null
  sql_generator:
    recommended: "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF"
    quant: "Q4_K_M"
    user_override: null

# ── Stack Services ────────────────────────────────────────────────────────────
stack:
  services:
    - inference
    - verifier
    - embeddings
    - vector_db
    - tabular
    - ocr
    - job_queue
    - gateway
    - proxy
    - metrics

# ── Ingestion Sources ─────────────────────────────────────────────────────────
ingestion:
  sources:
    - type: tally
      description: "TallyPrime via TDL/ODBC — vouchers, ledgers, stock items"
      connector: "connectors/tally_odbc.py"
      incremental: true      # only fetch since last run
      formats: [".900", ".1800", "odbc"]
      notes: "Paginate in batches of 500 vouchers to avoid Tally memory crash"

    - type: excel
      description: "Excel exports from Tally / manual entry"
      connector: "connectors/excel_duckdb.py"
      formats: [".xlsx", ".xls", ".csv"]

    - type: pdf_invoice
      description: "Scanned or digital invoices, receipts, GST documents"
      connector: "connectors/pdf_ocr.py"
      ocr_backend: "bhashini_parseq"
      formats: [".pdf", ".jpg", ".png", ".tiff"]

    - type: gst_portal
      description: "GSTN JSON exports (GSTR-1, GSTR-3B, GSTR-2A)"
      connector: "connectors/gst_json.py"
      formats: [".json"]

# ── OCR Settings ──────────────────────────────────────────────────────────────
ocr:
  indic_enabled: true
  primary_backend: "bhashini_parseq"
  fallback_backend: "tesseract"
  languages: ["tam", "hin", "eng"]   # Tamil, Hindi, English
  min_dpi: 150
  enhance_contrast: true

# ── Schema ────────────────────────────────────────────────────────────────────
schema:
  description: "CA firm core entities"
  entities:
    - voucher        # Tally voucher (purchase, sale, payment, receipt, journal)
    - ledger         # Chart of accounts
    - party          # Customer / vendor
    - stock_item     # Inventory item
    - gst_return     # GSTR-1, GSTR-3B, GSTR-2A

# ── Pipeline ─────────────────────────────────────────────────────────────────
pipeline:
  stages:
    - name: ingest
      description: "Pull from Tally ODBC / parse uploaded files"
      output: "DuckDB raw tables"

    - name: normalise
      description: "Unify schema across sources, resolve party names, fill GST numbers"
      llm_role: "Fuzzy entity resolution only (not computation)"
      deterministic: "DuckDB SQL transforms"

    - name: extract
      description: "LLM extracts structured JSON from unstructured docs (invoices, notes)"
      model: primary
      output_schema: "voucher JSON per document"
      verification: true

    - name: verify
      description: "Verifier model cross-checks citation — does extracted data match source text?"
      model: verifier
      reject_threshold: 0.7    # confidence below this → flag for human review

    - name: compute
      description: "ALL numeric aggregation in DuckDB. No LLM touches numbers."
      engine: duckdb
      examples:
        - "Monthly GST liability trend"
        - "Party-wise outstanding (AR/AP)"
        - "Top-10 expense categories YoY"
        - "Revenue seasonality by month"

    - name: anomaly
      description: "Statistical anomaly detection on computed aggregates"
      engine: python  # scipy / statsmodels — not LLM
      flags: ["revenue_spike", "unusual_party", "duplicate_invoice", "gst_mismatch"]

    - name: narrate
      description: "LLM generates executive narrative from verified, computed data"
      model: primary
      input: "Structured JSON (aggregates only — no raw PII)"
      egress_tier: 2    # only anonymised aggregates passed to narration stage

    - name: report
      description: "Generate PDF/HTML report with source citations"
      engine: python
      includes_source_references: true  # every claim cites source row/document

# ── Egress Policy ─────────────────────────────────────────────────────────────
egress:
  tier_1:
    stays_local:
      - raw_tally_data
      - client_names
      - gstin_numbers
      - per_voucher_data
      - party_contact_details

  tier_2:
    enabled: true
    requires_approval: true
    allowed:
      - monthly_aggregates
      - trend_percentages
      - anomaly_flags_without_entity_names

  tier_3:
    enabled: false        # set to true if user wants Claude/GPT narrative polish
    targets: []
    note: "Enable only for executive narrative polish. Aggregates only, no PII."

# ── Output Formats ────────────────────────────────────────────────────────────
outputs:
  - type: pdf_report
    template: "templates/ca-firm-report.html"
    includes: [charts, trend_tables, anomaly_flags, source_citations]
  - type: excel_export
    includes: [aggregated_tables]
  - type: json_api
    endpoint: "/v1/query"
    note: "Natural language queries via OpenAI-compatible API"
