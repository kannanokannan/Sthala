version: "3.9"

# Sthala — Observability stack
# Prometheus: metrics scraping
# OpenTelemetry Collector: GenAI semantic conventions (traces + metrics)

x-common: &common
  restart: unless-stopped
  networks:
    - sthala

services:

  # ── Prometheus ────────────────────────────────────────────────────────────
  metrics:
    image: prom/prometheus:latest
    container_name: sthala-metrics
    volumes:
      - ../../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${STHALA_DATA:-/var/sthala/data}/metrics:/prometheus
    ports:
      - "9090:9090"
    <<: *common

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sthala-otel
    volumes:
      - ../../config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics endpoint
    <<: *common

networks:
  sthala:
    driver: bridge
